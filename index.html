<body>

  <div class="contenedor">

    <!-- CABECERA -->
    <header class="cabecera">
      <a class="marca" href="./" aria-label="4oo, ir al inicio">
        <svg class="marca__logo" viewBox="40 40 284 116" width="88" height="36" aria-hidden="true">
          <text x="136" y="150" fill="#3A1C3D" font-family="Space Grotesk, sans-serif" font-size="150" text-anchor="end">4</text>
          <circle cx="186" cy="113" r="31" fill="none" stroke="#3A1C3D" stroke-width="12"/>
          <circle cx="282" cy="113" r="31" fill="none" stroke="#3A1C3D" stroke-width="12"/>
          <path d="M221.7,122.6 C223,130 236,136 240,150 M246.3,122.6 C245,130 232,136 228,150" fill="none" stroke="#3A1C3D" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="marca__lema">For Our Ovaries</span>

      <button type="button" class="boton-cuenta" aria-haspopup="dialog" aria-controls="acceso">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

        </svg>
        Cuenta

    <!-- CONTENIDO PRINCIPAL -->
    <main class="inicio">
      <h1 class="inicio__titulo">¿Por dónde empiezas hoy?</h1>
      <p class="inicio__intro">Cuatro espacios para que cuidar no frene tu carrera.</p>

      <!-- LAS CUATRO ÁREAS -->
      <nav class="areas" aria-label="Áreas de 4oo">

        <!-- 1. Simulador y panel -->
        <a class="area area--simulador" href="usuaria/simulador.html">
          <h2 class="area__titulo">Simulador y panel</h2>
          <svg class="area__dibujo" viewBox="0 0 200 140" aria-hidden="true">
            <rect x="30" y="82" width="26" height="48" fill="#FFFFFF"/>
            <rect x="70" y="62" width="26" height="68" fill="#FFFFFF"/>
            <rect x="110" y="92" width="26" height="38" fill="#FFFFFF"/>
            <rect x="150" y="42" width="26" height="88" fill="#FFFFFF"/>
            <polyline points="10,8 10,130 194,130" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
            <polyline points="30,60 82,40 122,72 190,14" fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="square"/>
          </svg>
        </a>

        <!-- 2. Red de mentoras -->
        <a class="area area--red" href="usuaria/mentoras.html">
          <h2 class="area__titulo">Red de mentoras</h2>
          <svg class="area__dibujo" viewBox="0 0 200 140" aria-hidden="true">
            <path d="M28,30 L110,18 L176,64 L96,104 L28,30 M110,18 L96,104 L26,118" fill="none" stroke="#3A1C3D" stroke-width="5" stroke-linecap="square"/>
            <rect x="16" y="18" width="24" height="24" fill="#FFFFFF" stroke="#3A1C3D" stroke-width="4"/>
            <rect x="98" y="6" width="24" height="24" fill="#FFD23F" stroke="#3A1C3D" stroke-width="4"/>
            <rect x="164" y="52" width="24" height="24" fill="#FFFFFF" stroke="#3A1C3D" stroke-width="4"/>
            <rect x="84" y="92" width="24" height="24" fill="#8B3DFF" stroke="#3A1C3D" stroke-width="4"/>
            <rect x="14" y="106" width="24" height="24" fill="#FFD23F" stroke="#3A1C3D" stroke-width="4"/>
          </svg>
        </a>

        <!-- 3. Rutas y cursos -->
        <a class="area area--rutas" href="usuaria/rutas.html">
          <h2 class="area__titulo">Rutas y cursos</h2>
          <svg class="area__dibujo" viewBox="0 0 200 140" aria-hidden="true">
            <polyline points="10,130 52,130 52,100 94,100 94,70 136,70 136,40 170,40" fill="none" stroke="#3A1C3D" stroke-width="6" stroke-linecap="square"/>
            <line x1="170" y1="40" x2="170" y2="6" stroke="#3A1C3D" stroke-width="6" stroke-linecap="square"/>
            <polygon points="173,6 198,15 173,24" fill="#FF7AC6" stroke="#3A1C3D" stroke-width="3"/>
            <rect x="24" y="110" width="14" height="14" fill="#8B3DFF"/>

        <!-- 4. Mi perfil y pasaporte -->

          <svg class="area__dibujo" viewBox="0 0 200 140" aria-hidden="true">

          </svg>
        </a>

      </nav>
   
    </main>

  </div>
  <!-- VENTANA DE ACCESO (demo) -->
  <dialog class="acceso" id="acceso" aria-labelledby="acceso-titulo">
    <form class="acceso__form" action="usuaria-activa/inicio.html" method="get">
      <button type="button" class="acceso__cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>

      <h2 class="acceso__titulo" id="acceso-titulo">Ingresa a 4oo</h2>

      <label class="acceso__etiqueta" for="acceso-usuario">Usuario</label>
      <input class="acceso__campo" id="acceso-usuario" type="text" autocomplete="username" autofocus>

      <label class="acceso__etiqueta" for="acceso-clave">Contraseña</label>
      <input class="acceso__campo" id="acceso-clave" type="password" autocomplete="current-password">

      <button type="submit" class="acceso__ingresar">Ingresar</button>

      <a class="acceso__olvido" href="#" role="button">¿Olvidaste tu contraseña?</a>
    </form>
  </dialog>

  <script>
    (function () {
      var dialogo = document.getElementById('acceso');
      var abrir = document.querySelector('.boton-cuenta');
      abrir.addEventListener('click', function () {
        dialogo.showModal();
      });
      dialogo.querySelector('.acceso__cerrar').addEventListener('click', function () {
        dialogo.close();
      });
      // Cerrar al hacer clic fuera de la ventana
      dialogo.addEventListener('click', function (e) {
        if (e.target === dialogo) dialogo.close();
      });
      // Solo demo: el enlace no hace nada
      dialogo.querySelector('.acceso__olvido').addEventListener('click', function (e) {
        e.preventDefault();
      });
      // Solo demo: al ingresar va a la vista de usuaria con activación (sin enviar datos)
      dialogo.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = 'usuaria-activa/inicio.html';
      });
    })();
  </script>
</body>
</html>
