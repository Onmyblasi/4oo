<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4oo · RRHH · Indicadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto:wght@500;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app" data-perfil="rrhh" data-pagina="indicadores">
<script src="../js/layout.js"></script>

<main id="contenido" class="page">
  <h1 class="page-title">Indicadores agregados</h1>

  <section aria-label="Indicadores" style="display: flex; flex-direction: column; gap: 16px">
    <div class="row">
      <div class="stat" style="gap: 12px">
        <div class="stat__label">Personas activas por sexo</div>
        <div class="stat__value">6</div>
        <div>
          <div class="bar-label" style="font-size: 13px; margin-bottom: 4px"><span>Mujeres</span><span style="font-weight: 600">5</span></div>
          <div class="bar"><div class="bar__fill" style="width: 83%"></div></div>
        </div>
        <div>
          <div class="bar-label" style="font-size: 13px; margin-bottom: 4px"><span>Hombres</span><span style="font-weight: 600">1</span></div>
          <div class="bar"><div class="bar__fill bar__fill--rosa" style="width: 17%"></div></div>
        </div>
      </div>
      <div class="stat">
        <div class="stat__label">Formación completada</div>
        <div class="stat__value">72 %</div>
        <div class="stat__detail">de los cursos asignados en planes activos</div>
      </div>
      <div class="stat">
        <div class="stat__label">Retención a 12 meses tras la vuelta</div>
        <div class="stat__value">92 %</div>
        <div class="stat__detail">de las personas que volvieron</div>
      </div>
    </div>
    <p class="muted">Datos de ejemplo. Agregados y anónimos.</p>
  </section>
</main>
</body>
</html>
